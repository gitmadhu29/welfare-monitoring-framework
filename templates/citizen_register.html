<!DOCTYPE html>
<html>
<head>
    <title>Citizen Registration</title>
    <style>
        body { font-family: Arial; background: #f4f7f6; padding: 20px; }
        .box { max-width: 500px; margin: auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; }
        input, select { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        .flash { color: red; margin-bottom: 10px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Create Account</h2>
        
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div class="flash">
              {% for message in messages %}{{ message }}<br>{% endfor %}
            </div>
          {% endif %}
        {% endwith %}

        <form method="POST" action="/citizen_register">
            <label>1. Select Scheme to Register</label>
            <select name="scheme_id" required>
                <option value="">-- Choose a Scheme --</option>
                {% for s in schemes %}
                <option value="{{ s.id }}">{{ s.name }} ({{ s.category }})</option>
                {% endfor %}
            </select>

            <label>Full Name</label>
            <input type="text" name="full_name" required>

            <label>Email (For Login)</label>
            <input type="email" name="email" required>

            <label>Password (Min 6 chars)</label>
            <input type="password" name="password" required>

            <label>Aadhaar Number</label>
            <input type="text" name="aadhaar_number" maxlength="12" required>

            <label>Date of Birth</label>
            <input type="date" name="date_of_birth" required>

            <label>Phone</label>
            <input type="text" name="phone" maxlength="10" required>

            <button type="submit">Create Account</button>
        </form>
        <p style="font-size: 13px; text-align: center; margin-top: 15px;">Already have an account? <a href="/citizen_login">Login here</a></p>
    </div>
</body>
</html>
