<!DOCTYPE html>
<html>
<head>
    <title>Register for a Welfare Scheme</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 60px auto; }
        input, select { width: 100%; padding: 8px; margin: 8px 0; }
        button { padding: 10px 20px; background: #1E2761; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <h2>Beneficiary Registration</h2>
    <form method="POST">
        <label>Full Name</label>
        <input type="text" name="name" required>

        <label>Address</label>
        <input type="text" name="address" required>

        <label>ID Number</label>
        <input type="text" name="id_number" required>

        <label>Scheme</label>
        <select name="scheme">
            <option value="Scholarship">Scholarship</option>
            <option value="Pension">Pension</option>
            <option value="Food Ration">Food Ration</option>
            <option value="Subsidy">Subsidy</option>
        </select>

        <button type="submit">Submit Application</button>
    </form>
</body>
</html>
